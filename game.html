<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dunk Master</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07111f;
    font-family:Arial,"Malgun Gothic",sans-serif;
}
#gameContainer{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
}
canvas{
    position:absolute;
    inset:0;
    width:100vw;
    height:100vh;
    display:block;
    touch-action:none;
}
#menu{
    position:absolute;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:linear-gradient(rgba(3,10,20,.72),rgba(3,10,20,.92));
    color:white;
    text-align:center;
}
.logo{font-size:clamp(55px,8vw,100px)}
.title{
    font-size:clamp(38px,6vw,72px);
    font-weight:900;
    text-shadow:0 5px 15px #000;
}
.subtitle{
    color:#b9d7ef;
    margin:10px 0 35px;
    font-size:clamp(14px,2vw,20px);
}
button{
    border:0;
    cursor:pointer;
    padding:18px 60px;
    border-radius:50px;
    background:linear-gradient(135deg,#ff7b00,#ff3d00);
    color:white;
    font-size:clamp(20px,3vw,28px);
    font-weight:bold;
    box-shadow:0 8px 25px rgba(255,80,0,.4);
}
#hud{
    position:absolute;
    z-index:5;
    top:18px;
    left:18px;
    right:18px;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}
.hudBox{
    min-width:105px;
    padding:9px 18px;
    border-radius:14px;
    background:rgba(0,0,0,.52);
    color:white;
    backdrop-filter:blur(8px);
}
.hudLabel{font-size:12px;color:#aaa}
.hudValue{font-size:26px;font-weight:900}
#powerBar{
    position:absolute;
    z-index:6;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    width:min(330px,55vw);
    height:20px;
    border-radius:20px;
    overflow:hidden;
    background:rgba(0,0,0,.5);
    opacity:0;
}
#powerFill{
    width:0;
    height:100%;
    background:linear-gradient(90deg,#00e5ff,#00ff66,#ffe600,#ff3300);
}
#message{
    position:absolute;
    z-index:7;
    top:16%;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:clamp(38px,6vw,70px);
    font-weight:900;
    text-shadow:0 5px 15px #000;
    opacity:0;
    pointer-events:none;
}
#instructions{
    position:absolute;
    z-index:6;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    color:rgba(255,255,255,.82);
    font-size:clamp(12px,1.6vw,17px);
    pointer-events:none;
    white-space:nowrap;
}
</style>
</head>

<body>
<div id="gameContainer">

<canvas id="gameCanvas"></canvas>

<div id="menu">
    <div class="logo">🏀</div>
    <div class="title">DUNK MASTER</div>
    <div class="subtitle">AIM • CHARGE • SHOOT • SCORE</div>
    <button id="startButton">게임 시작</button>
</div>

<div id="hud">
    <div class="hudBox">
        <div class="hudLabel">SCORE</div>
        <div class="hudValue" id="score">0</div>
    </div>
    <div class="hudBox">
        <div class="hudLabel">COMBO</div>
        <div class="hudValue" id="combo">x0</div>
    </div>
    <div class="hudBox">
        <div class="hudLabel">BEST</div>
        <div class="hudValue" id="best">0</div>
    </div>
</div>

<div id="powerBar"><div id="powerFill"></div></div>
<div id="message"></div>
<div id="instructions">공을 뒤쪽으로 드래그해서 포물선을 맞춘 뒤 놓으세요</div>

</div>

<script>
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
const menu=document.getElementById("menu");
const startButton=document.getElementById("startButton");
const scoreText=document.getElementById("score");
const comboText=document.getElementById("combo");
const bestText=document.getElementById("best");
const powerBar=document.getElementById("powerBar");
const powerFill=document.getElementById("powerFill");
const message=document.getElementById("message");

let W=window.innerWidth;
let H=window.innerHeight;

function resize(){
    W=window.innerWidth;
    H=window.innerHeight;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.floor(W*dpr);
    canvas.height=Math.floor(H*dpr);
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    reposition();
}
window.addEventListener("resize",resize);

function reposition(){
    player.x=W*.17;
    player.y=H*.78;
    if(!ball.flying){
        ball.x=player.x+W*.045;
        ball.y=player.y-H*.13;
    }
    hoop.x=Math.min(W*.78+Math.random()*W*.15,W*.90);
    hoop.y=H*(.30+Math.random()*.20);
}

let gameRunning=false;
let score=0;
let combo=0;
let best=Number(localStorage.getItem("basketBest"))||0;
bestText.textContent=best;

const player={
    x:W*.17,
    y:H*.78,
    shootAnim:0,
    shooting:false
};

const ball={
    x:W*.215,
    y:H*.65,
    radius:Math.max(18,Math.min(W,H)*.03),
    vx:0,
    vy:0,
    flying:false,
    rotation:0
};

const hoop={
    x:W*.82,
    y:H*.38,
    width:Math.max(95,W*.13),
    height:Math.max(60,H*.13)
};

const GRAVITY=H*.0007;
let wind=0;
let aiming=false;
let aimX=0,aimY=0;

const buildings=[];
for(let i=0;i<18;i++){
    buildings.push({
        x:i/18,
        w:.055+Math.random()*.035,
        h:.10+Math.random()*.17
    });
}

function startGame(){
    menu.style.display="none";
    gameRunning=true;
    score=0;
    combo=0;
    player.shooting=false;
    player.shootAnim=0;
    resetBall();
    newHoop();
    updateHUD();
    showMessage("START!",700);
}

startButton.addEventListener("click",startGame);

function resetBall(){
    ball.flying=false;
    ball.vx=0;
    ball.vy=0;
    ball.rotation=0;
    ball.x=player.x+W*.045;
    ball.y=player.y-H*.13;
    player.shooting=false;
    player.shootAnim=0;
}

function newHoop(){
    const difficulty=Math.min(score,15);
    hoop.width=Math.max(W*.055,W*.13-difficulty*W*.0035);
    hoop.height=Math.max(H*.075,H*.13-difficulty*H*.002);
    hoop.x=Math.min(W*(.73+Math.random()*.18),W*.91);
    hoop.y=H*(.27+Math.random()*.24);
    wind=(Math.random()-.5)*W*.00005;
}

function getPointer(e){
    const rect=canvas.getBoundingClientRect();
    const source=e.touches?e.touches[0]:e;
    return{
        x:source.clientX-rect.left,
        y:source.clientY-rect.top
    };
}

function pointerDown(e){
    if(!gameRunning||ball.flying||player.shooting)return;
    e.preventDefault();
    const p=getPointer(e);
    aiming=true;
    aimX=p.x;
    aimY=p.y;
    powerBar.style.opacity=1;
    updatePower();
}

function pointerMove(e){
    if(!aiming)return;
    e.preventDefault();
    const p=getPointer(e);
    aimX=p.x;
    aimY=p.y;
    updatePower();
}

function pointerUp(e){
    if(!aiming)return;
    e.preventDefault();
    aiming=false;
    powerBar.style.opacity=0;
    shoot();
}

canvas.addEventListener("mousedown",pointerDown);
canvas.addEventListener("mousemove",pointerMove);
canvas.addEventListener("mouseup",pointerUp);
canvas.addEventListener("touchstart",pointerDown,{passive:false});
canvas.addEventListener("touchmove",pointerMove,{passive:false});
canvas.addEventListener("touchend",pointerUp,{passive:false});

function getShotData(){
    const dx=ball.x-aimX;
    const dy=ball.y-aimY;
    const distance=Math.hypot(dx,dy);
    if(distance<1)return{distance:0,power:0,vx:0,vy:0};
    const power=Math.min(distance/13,30);
    return{
        distance,
        power,
        vx:(dx/distance)*power,
        vy:(dy/distance)*power
    };
}

function updatePower(){
    const s=getShotData();
    powerFill.style.width=Math.min(s.distance/3,100)+"%";
}

function shoot(){
    const s=getShotData();
    if(s.distance<20)return;

    ball.vx=s.vx;
    ball.vy=s.vy;
    ball.flying=true;

    /* 슈팅 모션 시작 */
    player.shooting=true;
    player.shootAnim=0;
}

function update(){
    if(!gameRunning)return;

    /* 캐릭터 슈팅 모션 */
    if(player.shooting){
        player.shootAnim+=0.055;

        if(player.shootAnim>=1){
            player.shootAnim=1;
            player.shooting=false;
        }
    }

    if(ball.flying){
        ball.vy+=GRAVITY;
        ball.vx+=wind;
        ball.x+=ball.vx;
        ball.y+=ball.vy;
        ball.rotation+=ball.vx*.04;

        checkHoop();

        if(ball.x>W+100||ball.y>H+100||ball.x<-100){
            miss();
        }
    }else if(!player.shooting){
        ball.x=player.x+W*.045;
        ball.y=player.y-H*.13;
    }
}

function checkHoop(){
    const rimY=hoop.y+hoop.height*.55;
    const left=hoop.x-hoop.width/2;
    const right=hoop.x+hoop.width/2;

    if(
        ball.vy>0 &&
        ball.y>=rimY-8 &&
        ball.y<=rimY+18 &&
        ball.x>=left &&
        ball.x<=right
    ){
        scoreGoal();
    }
}

function scoreGoal(){
    ball.flying=false;
    combo++;
    score+=10*combo;

    if(score>best){
        best=score;
        localStorage.setItem("basketBest",best);
    }

    updateHUD();
    showMessage("+"+(10*combo),700);

    setTimeout(()=>{
        if(!gameRunning)return;
        resetBall();
        newHoop();
    },500);
}

function miss(){
    if(!gameRunning)return;
    ball.flying=false;
    combo=0;
    updateHUD();
    showMessage("MISS!",900);
    setTimeout(gameOver,900);
}

function gameOver(){
    gameRunning=false;
    menu.style.display="flex";
    startButton.textContent="다시 시작";
}

function updateHUD(){
    scoreText.textContent=score;
    comboText.textContent="x"+combo;
    bestText.textContent=best;
}

function showMessage(text,duration){
    message.textContent=text;
    message.style.opacity=1;
    setTimeout(()=>message.style.opacity=0,duration);
}

/* -------------------------
   배경
------------------------- */
function drawBackground(){
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,"#68b9f0");
    sky.addColorStop(.58,"#d7f3ff");
    sky.addColorStop(.59,"#b7b7b7");
    sky.addColorStop(1,"#777");
    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle="rgba(40,70,90,.22)";
    for(const b of buildings){
        const bx=b.x*W;
        const bh=b.h*H;
        ctx.fillRect(bx,H*.59-bh,b.w*W,bh);
    }

    /* 코트 */
    ctx.fillStyle="#777";
    ctx.fillRect(0,H*.72,W,H*.28);

    ctx.strokeStyle="rgba(255,255,255,.55)";
    ctx.lineWidth=4;

    ctx.beginPath();
    ctx.arc(W*.18,H*.72,Math.min(W,H)*.17,Math.PI,Math.PI*2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0,H*.88);
    ctx.lineTo(W,H*.88);
    ctx.stroke();
}

/* -------------------------
   골대
------------------------- */
function drawHoop(){
    const left=hoop.x-hoop.width/2;
    const rimY=hoop.y+hoop.height*.55;

    /* 기둥 */
    ctx.strokeStyle="#333";
    ctx.lineWidth=Math.max(8,W*.008);
    ctx.beginPath();
    ctx.moveTo(hoop.x+hoop.width*.45,rimY);
    ctx.lineTo(hoop.x+hoop.width*.45,H*.72);
    ctx.stroke();

    /* 백보드 */
    ctx.fillStyle="rgba(255,255,255,.88)";
    ctx.fillRect(left-20,hoop.y,hoop.width+40,14);

    ctx.strokeStyle="#444";
    ctx.lineWidth=4;
    ctx.strokeRect(left-20,hoop.y,hoop.width+40,14);

    /* 림 */
    ctx.strokeStyle="#f04a17";
    ctx.lineWidth=Math.max(7,W*.006);
    ctx.beginPath();
    ctx.ellipse(hoop.x,rimY,hoop.width/2,Math.max(7,H*.012),0,0,Math.PI*2);
    ctx.stroke();

    /* 그물 */
    ctx.strokeStyle="rgba(255,255,255,.72)";
    ctx.lineWidth=2;

    for(let i=-4;i<=4;i++){
        ctx.beginPath();
        ctx.moveTo(hoop.x+i*hoop.width/10,rimY);
        ctx.lineTo(hoop.x+i*hoop.width/14,rimY+hoop.height*.52);
        ctx.stroke();
    }
}

/* -------------------------
   사람
   슈팅 애니메이션
------------------------- */
function drawPlayer(){
    const x=player.x;
    const y=player.y;
    const a=player.shootAnim;

    /*
      a:
      0   = 준비 자세
      .35 = 공을 위로 올림
      .55 = 릴리즈
      1   = 팔로우스루
    */

    let raise=Math.sin(Math.min(a/.65,1)*Math.PI/2);
    let follow=Math.max(0,(a-.55)/.45);

    ctx.save();
    ctx.translate(x,y);

    /* 그림자 */
    ctx.fillStyle="rgba(0,0,0,.25)";
    ctx.beginPath();
    ctx.ellipse(0,5,Math.min(W,H)*.055,Math.min(W,H)*.012,0,0,Math.PI*2);
    ctx.fill();

    const leg=Math.min(W,H)*.055;
    const torso=Math.min(W,H)*.085;

    /* 다리 */
    ctx.strokeStyle="#222";
    ctx.lineWidth=Math.max(10,Math.min(W,H)*.018);
    ctx.lineCap="round";

    ctx.beginPath();
    ctx.moveTo(-10,-10);
    ctx.lineTo(-leg*.55,leg*.75);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(10,-10);
    ctx.lineTo(leg*.55,leg*.65);
    ctx.stroke();

    /* 신발 */
    ctx.fillStyle="#f2f2f2";
    ctx.beginPath();
    ctx.ellipse(-leg*.65,leg*.82,leg*.34,leg*.13,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(leg*.65,leg*.72,leg*.34,leg*.13,0,0,Math.PI*2);
    ctx.fill();

    /* 몸 */
    ctx.fillStyle="#e53935";
    ctx.beginPath();
    ctx.moveTo(-torso*.42,-torso*1.05);
    ctx.lineTo(torso*.42,-torso*1.05);
    ctx.lineTo(torso*.34,-torso*.08);
    ctx.lineTo(-torso*.34,-torso*.08);
    ctx.closePath();
    ctx.fill();

    /* 번호 */
    ctx.fillStyle="white";
    ctx.font=`bold ${Math.max(20,Math.min(W,H)*.035)}px Arial`;
    ctx.textAlign="center";
    ctx.fillText("23",0,-torso*.48);

    /* 목 */
    ctx.fillStyle="#d99a6c";
    ctx.fillRect(-7,-torso*1.15,14,18);

    /* 머리 */
    ctx.beginPath();
    ctx.arc(0,-torso*1.42,torso*.32,0,Math.PI*2);
    ctx.fill();

    /* 머리카락 */
    ctx.fillStyle="#171717";
    ctx.beginPath();
    ctx.arc(0,-torso*1.51,torso*.33,Math.PI,Math.PI*2);
    ctx.fill();

    /* 머리띠 */
    ctx.strokeStyle="white";
    ctx.lineWidth=4;
    ctx.beginPath();
    ctx.moveTo(-torso*.28,-torso*1.51);
    ctx.lineTo(torso*.28,-torso*1.51);
    ctx.stroke();

    /* 팔 */
    ctx.strokeStyle="#d99a6c";
    ctx.lineWidth=Math.max(9,Math.min(W,H)*.017);

    /*
      슈팅 전:
      공을 양손으로 가슴 앞에 둠.

      슈팅:
      양팔을 위로 올리고
      마지막에는 팔을 완전히 펴서
      팔로우스루.
    */
    const handX=torso*.58;
    const handY=-torso*.82-raise*torso*.72;

    ctx.beginPath();
    ctx.moveTo(torso*.30,-torso*.82);
    ctx.lineTo(torso*.50,-torso*.75);
    ctx.lineTo(handX,handY);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-torso*.30,-torso*.82);
    ctx.lineTo(-torso*.50,-torso*.72);
    ctx.lineTo(handX*.72,handY+8);
    ctx.stroke();

    /* 릴리즈 이후 오른팔 팔로우스루 */
    if(follow>0){
        ctx.strokeStyle="#d99a6c";
        ctx.lineWidth=Math.max(9,Math.min(W,H)*.017);

        ctx.beginPath();
        ctx.moveTo(torso*.30,-torso*.82);
        ctx.lineTo(torso*.75,-torso*1.18);
        ctx.lineTo(torso*.82,-torso*1.72);
        ctx.stroke();
    }

    ctx.restore();
}

/* -------------------------
   공
------------------------- */
function drawBall(){
    ctx.fillStyle="rgba(0,0,0,.22)";
    ctx.beginPath();
    ctx.ellipse(ball.x+7,H*.72,ball.radius*1.2,ball.radius*.28,0,0,Math.PI*2);
    ctx.fill();

    const g=ctx.createRadialGradient(
        ball.x-ball.radius*.35,
        ball.y-ball.radius*.35,
        2,
        ball.x,
        ball.y,
        ball.radius
    );
    g.addColorStop(0,"#ffb347");
    g.addColorStop(1,"#e65100");

    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);
    ctx.fill();

    ctx.save();
    ctx.translate(ball.x,ball.y);
    ctx.rotate(ball.rotation);

    ctx.strokeStyle="#351500";
    ctx.lineWidth=2.5;

    ctx.beginPath();
    ctx.arc(0,0,ball.radius*.7,-Math.PI/2,Math.PI/2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-ball.radius,0);
    ctx.quadraticCurveTo(0,-7,ball.radius,0);
    ctx.stroke();

    ctx.restore();
}

/* -------------------------
   포물선 궤적
------------------------- */
function drawTrajectory(){
    if(!aiming)return;

    const s=getShotData();
    if(s.distance<20)return;

    ctx.fillStyle="rgba(255,255,255,.9)";

    let px=ball.x;
    let py=ball.y;
    let vx=s.vx;
    let vy=s.vy;

    for(let t=0;t<75;t+=2){

        const fx=px+vx*t+0.5*wind*t*t;
        const fy=py+vy*t+0.5*GRAVITY*t*t;

        if(fx<0||fx>W||fy<0||fy>H)break;

        const nearHoop=Math.hypot(
            fx-hoop.x,
            fy-(hoop.y+hoop.height*.55)
        )<hoop.width*.55;

        ctx.beginPath();
        ctx.arc(
            fx,
            fy,
            nearHoop?5:3.5,
            0,
            Math.PI*2
        );
        ctx.fill();
    }
}

function drawAimGuide(){
    if(!aiming)return;

    const s=getShotData();
    if(s.distance<20)return;

    /* 당기는 선 */
    ctx.strokeStyle="rgba(255,255,255,.55)";
    ctx.lineWidth=3;
    ctx.setLineDash([8,8]);

    ctx.beginPath();
    ctx.moveTo(ball.x,ball.y);
    ctx.lineTo(aimX,aimY);
    ctx.stroke();

    ctx.setLineDash([]);

    /* 포인터 */
    ctx.fillStyle="#00ffcc";
    ctx.beginPath();
    ctx.arc(aimX,aimY,9,0,Math.PI*2);
    ctx.fill();

    /* 포물선 */
    drawTrajectory();
}

function drawWind(){
    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.font=`${Math.max(16,Math.min(W,H)*.025)}px Arial`;
    ctx.textAlign="center";
    ctx.fillText(
        wind>=0?"🌬️ 바람 →":"🌬️ ← 바람",
        W*.5,
        45
    );
}

function draw(){
    ctx.clearRect(0,0,W,H);
    drawBackground();
    drawWind();
    drawHoop();
    drawPlayer();
    drawAimGuide();
    drawBall();
}

function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}

resize();
loop();
</script>
</body>
</html>
