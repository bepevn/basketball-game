<!DOCTYPE html>

<style>

    box-sizing: border-box;
    margin: 0;
    padding: 0;

body {
    background: #07111f;
    font-family: Arial, "Malgun Gothic", sans-serif;

#gameContainer {

canvas {
    display: block;

        );

<body>

<div id="gameContainer">

<canvas
id="gameCanvas"
width="1400"
height="800">
</canvas>


<div id="menu">

    <div class="logo">🏀</div>

    <div class="title">
        DUNK MASTER
    </div>

    <div class="subtitle">
        AIM • CHARGE • SHOOT • SCORE
    </div>

    <button id="startButton">
        게임 시작
    </button>

</div>


<div id="hud">

    <div class="hudBox">
        <div class="hudLabel">
            SCORE
        </div>

        <div
        class="hudValue"
        id="score">
        0
        </div>
    </div>


    <div class="hudBox">
        <div class="hudLabel">
            COMBO
        </div>

        <div
        class="hudValue"
        id="combo">
        x0
        </div>
    </div>


    <div class="hudBox">
        <div class="hudLabel">
            BEST
        </div>

        <div
        class="hudValue"
        id="best">
        0
        </div>
    </div>

</div>


<div id="powerBar">
    <div id="powerFill"></div>
</div>


<div id="message"></div>


<div id="instructions">
    공을 뒤쪽으로 드래그한 뒤 놓으세요
</div>

</div>


<script>

/* =================================
   기본 설정
================================= */

const canvas =
document.getElementById("gameCanvas");

const ctx =
canvas.getContext("2d");

const menu =
document.getElementById("menu");

const startButton =
document.getElementById("startButton");

const scoreText =
document.getElementById("score");

const comboText =
document.getElementById("combo");

const bestText =
document.getElementById("best");

const powerBar =
document.getElementById("powerBar");

const powerFill =
document.getElementById("powerFill");

const message =
document.getElementById("message");


/* =================================
   게임 상태
================================= */

let gameRunning = false;

let score = 0;

let combo = 0;

let best =
Number(localStorage.getItem("basketBest")) || 0;

bestText.textContent = best;


/* =================================
   공

   기존:
   x = 145
   y = 570

   수정:
   골대와 플레이하기 편하도록
   조금 오른쪽 + 위로 이동
================================= */

const ball = {

    x: 260,

    y: 560,

    radius: 24,

    vx: 0,

    vy: 0,

    flying: false,

    rotation: 0
};


/* =================================
   골대
================================= */

const hoop = {

    x: 1050,

    y: 300,

    width: 170,

    height: 100
};


/* =================================
   바람
================================= */

let wind = 0;


/* =================================
   조준
================================= */

let aiming = false;

let aimX = 0;

let aimY = 0;


/* =================================
   ⭐ 배경 건물 고정 ⭐

   기존 코드에서는 drawBackground()
   안에서 Math.random()을 실행해서

   매 프레임마다

   건물 높이
   건물 위치

   가 새로 만들어졌음.

   그래서 배경이 계속 움직였음.

   이제 게임 시작 전에 한 번만 생성.
================================= */

const buildings = [];

for (
    let i = 0;
    i < 14;
    i++
) {

    buildings.push({

        x: i * 110,

        width: 85,

        height:
            70 +
            Math.random() * 120
    });
}


/* =================================
   게임 시작
================================= */

startButton.addEventListener(
    "click",
    startGame
);


function startGame() {

    menu.style.display = "none";

    gameRunning = true;

    score = 0;

    combo = 0;

    resetBall();

    newHoop();

    updateHUD();

    showMessage(
        "START!",
        800
    );
}


/* =================================
   공 초기화
================================= */

function resetBall() {

    ball.x = 260;

    ball.y = 560;

    ball.vx = 0;

    ball.vy = 0;

    ball.flying = false;

    ball.rotation = 0;
}


/* =================================
   골대 위치 변경
================================= */

function newHoop() {

    /*
        점수가 올라갈수록
        골대가 작아짐
    */

    hoop.width =
        Math.max(
            80,
            170 - score * 4
        );

    hoop.height =
        Math.max(
            55,
            100 - score * 2
        );


    /*
        골대 위치

        화면 오른쪽에 배치
    */

    hoop.x =
        900 +
        Math.random() * 350;

    hoop.y =
        180 +
        Math.random() * 270;


    /*
        바람
    */

    wind =
        (Math.random() - 0.5)
        * 0.06;
}


/* =================================
   마우스 좌표
================================= */

function getPointer(e) {

    const rect =
        canvas.getBoundingClientRect();

    let clientX;
    let clientY;


    if (e.touches) {

        clientX =
            e.touches[0].clientX;

        clientY =
            e.touches[0].clientY;

    } else {

        clientX =
            e.clientX;

        clientY =
            e.clientY;
    }


    return {

        x:
            (clientX - rect.left)
            *
            canvas.width
            /
            rect.width,

        y:
            (clientY - rect.top)
            *
            canvas.height
            /
            rect.height
    };
}


/* =================================
   조준 시작
================================= */

canvas.addEventListener(
    "mousedown",
    pointerDown
);

canvas.addEventListener(
    "touchstart",
    pointerDown,
    { passive:false }
);


function pointerDown(e) {

    if (!gameRunning)
        return;

    if (ball.flying)
        return;

    e.preventDefault();

    const p =
        getPointer(e);

    aiming = true;

    aimX = p.x;

    aimY = p.y;

    powerBar.style.opacity = 1;
}


/* =================================
   조준 이동
================================= */

canvas.addEventListener(
    "mousemove",
    pointerMove
);

canvas.addEventListener(
    "touchmove",
    pointerMove,
    { passive:false }
);


function pointerMove(e) {

    if (!aiming)
        return;

    e.preventDefault();

    const p =
        getPointer(e);

    aimX = p.x;

    aimY = p.y;

    updatePower();
}


/* =================================
   파워
================================= */

function updatePower() {

    let dx =
        ball.x - aimX;

    let dy =
        ball.y - aimY;

    let distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    let power =
        Math.min(
            distance / 3,
            100
        );


    powerFill.style.width =
        power + "%";
}


/* =================================
   슛
================================= */

canvas.addEventListener(
    "mouseup",
    pointerUp
);

canvas.addEventListener(
    "touchend",
    pointerUp,
    { passive:false }
);


function pointerUp(e) {

    if (!aiming)
        return;

    e.preventDefault();

    aiming = false;

    powerBar.style.opacity = 0;

    shoot();
}


/* =================================
   공 발사
================================= */

function shoot() {

    let dx =
        ball.x - aimX;

    let dy =
        ball.y - aimY;


    let distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (distance < 20)
        return;


    let power =
        Math.min(
            distance / 13,
            30
        );


    let nx =
        dx / distance;

    let ny =
        dy / distance;


    ball.vx =
        nx * power;

    ball.vy =
        ny * power;


    ball.flying = true;
}


/* =================================
   물리
================================= */

function update() {

    if (!gameRunning)
        return;


    if (ball.flying) {

        /*
            중력
        */

        ball.vy += 0.45;


        /*
            바람
        */

        ball.vx += wind;


        /*
            위치
        */

        ball.x += ball.vx;

        ball.y += ball.vy;


        /*
            회전
        */

        ball.rotation +=
            ball.vx * 0.04;


        /*
            골 판정
        */

        checkHoop();


        /*
            화면 밖
        */

        if (
            ball.x >
            canvas.width + 100 ||

            ball.y >
            canvas.height + 100 ||

            ball.x < -100
        ) {

            miss();
        }
    }
}


/* =================================
   골 판정
================================= */

function checkHoop() {

    const rimY =
        hoop.y +
        hoop.height * 0.55;


    const left =
        hoop.x -
        hoop.width / 2;

    const right =
        hoop.x +
        hoop.width / 2;


    if (
        ball.vy > 0 &&

        ball.y >= rimY - 5 &&

        ball.y <= rimY + 15 &&

        ball.x >= left &&

        ball.x <= right
    ) {

        scoreGoal();
    }
}


/* =================================
   골 성공
================================= */

function scoreGoal() {

    ball.flying = false;

    combo++;

    score +=
        10 * combo;


    if (score > best) {

        best = score;

        localStorage.setItem(
            "basketBest",
            best
        );
    }


    updateHUD();


    showMessage(
        "+" + (10 * combo),
        700
    );


    setTimeout(
        () => {

            if (!gameRunning)
                return;

            resetBall();

            newHoop();

        },
        500
    );
}


/* =================================
   실패
================================= */

function miss() {

    if (!gameRunning)
        return;


    ball.flying = false;

    combo = 0;

    updateHUD();


    showMessage(
        "MISS!",
        900
    );


    setTimeout(
        gameOver,
        900
    );
}


/* =================================
   게임 오버
================================= */

function gameOver() {

    gameRunning = false;

    menu.style.display = "flex";

    startButton.textContent =
        "다시 시작";
}


/* =================================
   HUD
================================= */

function updateHUD() {

    scoreText.textContent =
        score;

    comboText.textContent =
        "x" + combo;

    bestText.textContent =
        best;
}


/* =================================
   메시지
================================= */

function showMessage(
    text,
    duration
) {

    message.textContent =
        text;

    message.style.opacity = 1;


    setTimeout(
        () => {

            message.style.opacity = 0;

        },
        duration
    );
}


/* =================================
   ⭐ 고정된 배경 ⭐
================================= */

function drawBackground() {

    /*
        바닥
    */

    ctx.fillStyle =
        "#777";

    ctx.fillRect(
        0,
        660,
        canvas.width,
        140
    );


    /*
        코트 라인
    */

    ctx.strokeStyle =
        "rgba(255,255,255,0.5)";

    ctx.lineWidth = 4;


    ctx.beginPath();

    ctx.arc(
        260,
        660,
        150,
        Math.PI,
        Math.PI * 2
    );

    ctx.stroke();


    /*
        ⭐ 건물

        이제 Math.random() 사용 안 함
        → 완전히 고정됨
    */

    ctx.fillStyle =
        "rgba(50,70,90,0.25)";


    for (
        let i = 0;
        i < buildings.length;
        i++
    ) {

        const building =
            buildings[i];


        ctx.fillRect(

            building.x,

            660 -
            building.height,

            building.width,

            building.height
        );
    }
}


/* =================================
   골대
================================= */

function drawHoop() {

    const left =
        hoop.x -
        hoop.width / 2;


    const rimY =
        hoop.y +
        hoop.height * 0.55;


    /*
        백보드
    */

    ctx.fillStyle =
        "rgba(255,255,255,0.85)";


    ctx.fillRect(
        left - 25,
        hoop.y,
        hoop.width + 50,
        14
    );


    /*
        백보드 테두리
    */

    ctx.strokeStyle =
        "#444";

    ctx.lineWidth = 4;


    ctx.strokeRect(
        left - 25,
        hoop.y,
        hoop.width + 50,
        14
    );


    /*
        림
    */

    ctx.strokeStyle =
        "#ff3b00";

    ctx.lineWidth = 10;


    ctx.beginPath();

    ctx.ellipse(
        hoop.x,
        rimY,
        hoop.width / 2,
        11,
        0,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    /*
        그물
    */

    ctx.strokeStyle =
        "rgba(255,255,255,0.7)";

    ctx.lineWidth = 2;


    for (
        let i = -4;
        i <= 4;
        i++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            hoop.x +
            i *
            hoop.width /
            10,

            rimY
        );

        ctx.lineTo(
            hoop.x +
            i *
            hoop.width /
            14,

            rimY + 55
        );

        ctx.stroke();
    }


    for (
        let i = -3;
        i <= 3;
        i++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            left +
            hoop.width *
            (i + 4) /
            8,

            rimY + 10
        );

        ctx.lineTo(
            left +
            hoop.width *
            (i + 4) /
            8,

            rimY + 50
        );

        ctx.stroke();
    }
}


/* =================================
   공
================================= */

function drawBall() {

    /*
        공 그림자
    */

    ctx.fillStyle =
        "rgba(0,0,0,0.25)";


    ctx.beginPath();

    ctx.ellipse(
        ball.x + 8,
        660,
        30,
        8,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
        공
    */

    const gradient =
        ctx.createRadialGradient(
            ball.x - 8,
            ball.y - 8,
            3,

            ball.x,
            ball.y,
            ball.radius
        );


    gradient.addColorStop(
        0,
        "#ffb347"
    );

    gradient.addColorStop(
        1,
        "#e65100"
    );


    ctx.fillStyle =
        gradient;


    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
        농구공 선
    */

    ctx.strokeStyle =
        "#351500";

    ctx.lineWidth = 3;


    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius * 0.7,
        -Math.PI / 2,
        Math.PI / 2
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        ball.x - ball.radius,
        ball.y
    );

    ctx.quadraticCurveTo(
        ball.x,
        ball.y - 7,

        ball.x + ball.radius,
        ball.y
    );

    ctx.stroke();
}


/* =================================
   조준선
================================= */

function drawAim() {

    if (!aiming)
        return;


    /*
        공에서 마우스
    */

    ctx.strokeStyle =
        "rgba(255,255,255,0.8)";

    ctx.lineWidth = 4;

    ctx.setLineDash([
        10,
        10
    ]);


    ctx.beginPath();

    ctx.moveTo(
        ball.x,
        ball.y
    );

    ctx.lineTo(
        aimX,
        aimY
    );

    ctx.stroke();


    ctx.setLineDash([]);


    /*
        예상 방향
    */

    let dx =
        ball.x - aimX;

    let dy =
        ball.y - aimY;


    let distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (distance > 20) {

        let nx =
            dx / distance;

        let ny =
            dy / distance;


        ctx.strokeStyle =
            "#00ffcc";

        ctx.lineWidth = 3;


        ctx.beginPath();

        ctx.moveTo(
            ball.x,
            ball.y
        );

        ctx.lineTo(
            ball.x + nx * 200,
            ball.y + ny * 200
        );

        ctx.stroke();
    }
}


/* =================================
   바람
================================= */

function drawWind() {

    ctx.fillStyle =
        "rgba(0,0,0,0.35)";

    ctx.font =
        "20px Arial";


    if (wind > 0) {

        ctx.fillText(
            "🌬️ 바람 →",
            620,
            55
        );

    } else {

        ctx.fillText(
            "🌬️ ← 바람",
            620,
            55
        );
    }
}


/* =================================
   화면 그리기
================================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawBackground();

    drawWind();

    drawHoop();

    drawAim();

    drawBall();
}


/* =================================
   게임 루프
================================= */

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );
}


gameLoop();

</script>

</body>
</html>
