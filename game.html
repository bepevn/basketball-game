<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dunk Master</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07111f;
    font-family:Arial,"Malgun Gothic",sans-serif;
}
#gameContainer{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
}
canvas{
    position:absolute;
    inset:0;
    width:100vw;
    height:100vh;
    display:block;
    touch-action:none;
}
#menu{
    position:absolute;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:linear-gradient(rgba(3,10,20,.72),rgba(3,10,20,.92));
    color:white;
    text-align:center;
}
.logo{font-size:clamp(55px,8vw,100px)}
.title{
    font-size:clamp(38px,6vw,72px);
    font-weight:900;
    text-shadow:0 5px 15px #000;
}
.subtitle{
    color:#b9d7ef;
    margin:10px 0 35px;
    font-size:clamp(14px,2vw,20px);
}
button{
    border:0;
    cursor:pointer;
    padding:18px 60px;
    border-radius:50px;
    background:linear-gradient(135deg,#ff7b00,#ff3d00);
    color:white;
    font-size:clamp(20px,3vw,28px);
    font-weight:bold;
    box-shadow:0 8px 25px rgba(255,80,0,.4);
}
#hud{
    position:absolute;
    z-index:5;
    top:18px;
    left:18px;
    right:18px;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}
.hudBox{
    min-width:105px;
    padding:9px 18px;
    border-radius:14px;
    background:rgba(0,0,0,.52);
    color:white;
    backdrop-filter:blur(8px);
}
.hudLabel{font-size:12px;color:#aaa}
.hudValue{font-size:26px;font-weight:900}
#powerBar{
    position:absolute;
    z-index:6;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    width:min(330px,55vw);
    height:20px;
    border-radius:20px;
    overflow:hidden;
    background:rgba(0,0,0,.5);
    opacity:0;
}
#powerFill{
    width:0;
    height:100%;
    background:linear-gradient(90deg,#00e5ff,#00ff66,#ffe600,#ff3300);
}
#message{
    position:absolute;
    z-index:7;
    top:16%;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:clamp(38px,6vw,70px);
    font-weight:900;
    text-shadow:0 5px 15px #000;
    opacity:0;
    pointer-events:none;
}
#instructions{
    position:absolute;
    z-index:6;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    color:rgba(255,255,255,.82);
    font-size:clamp(12px,1.6vw,17px);
    pointer-events:none;
    white-space:nowrap;
}

#skillSelect{
    display:flex;
    gap:14px;
    margin:0 0 24px;
    flex-wrap:wrap;
    justify-content:center;
}
.skillBtn{
    padding:12px 20px;
    border-radius:14px;
    background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.25);
    color:white;
    font-size:16px;
    font-weight:bold;
    box-shadow:none;
}
.skillBtn.selected{
    border-color:#ffd54a;
    background:rgba(255,193,7,.25);
}
#skillInfo{
    margin-top:14px;
    color:#ffe082;
    font-size:14px;
}
</style>
</head>

<body>
<div id="gameContainer">

<canvas id="gameCanvas"></canvas>

<div id="menu">
    <div class="logo">🏀</div>
    <div class="title">DUNK MASTER</div>
    <div class="subtitle">AIM • CHARGE • SHOOT • SCORE</div>
    <div id="skillSelect">
        <button class="skillBtn selected" data-skill="triple">1. 공 3개 발사</button>
        <button class="skillBtn" data-skill="bigHoop">2. 골대 크기 키우기</button>
    </div>
    <div id="skillInfo">선택한 스킬: 공 3개 발사 · 골 5개마다 1회 충전 · E 사용</div>
    <button id="startButton">게임 시작</button>
</div>

<div id="hud">
    <div class="hudBox">
        <div class="hudLabel">SCORE</div>
        <div class="hudValue" id="score">0</div>
    </div>
    <div class="hudBox">
        <div class="hudLabel">COMBO</div>
        <div class="hudValue" id="combo">x0</div>
    </div>
    <div class="hudBox">
        <div class="hudLabel">LIVES</div>
        <div class="hudValue" id="lives">♥♥♥</div>
    </div>
    <div class="hudBox">
        <div class="hudLabel">BEST</div>
        <div class="hudValue" id="best">0</div>
    </div>
</div>

<div id="powerBar"><div id="powerFill"></div></div>
<div id="message"></div>
<div id="instructions">공을 뒤쪽으로 드래그해서 포물선을 맞춘 뒤 놓으세요 · E = 스킬 사용</div>

</div>

<script>
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
const menu=document.getElementById("menu");
const startButton=document.getElementById("startButton");
const scoreText=document.getElementById("score");
const comboText=document.getElementById("combo");
const bestText=document.getElementById("best");
const livesText=document.getElementById("lives");
const powerBar=document.getElementById("powerBar");
const powerFill=document.getElementById("powerFill");
const message=document.getElementById("message");
const skillButtons=document.querySelectorAll(".skillBtn");
const skillInfo=document.getElementById("skillInfo");
let selectedSkill="triple";
let skillCharges=0;
let madeShots=0;
let skillBalls=[];

let W=window.innerWidth;
let H=window.innerHeight;

function resize(){
    W=window.innerWidth;
    H=window.innerHeight;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.floor(W*dpr);
    canvas.height=Math.floor(H*dpr);
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    reposition();
}
window.addEventListener("resize",resize);

function reposition(){
    player.x=W*.17;
    player.y=H*.78;
    if(!ball.flying){
        ball.x=player.x+W*.045;
        ball.y=player.y-H*.13;
    }
    hoop.x=Math.min(W*.78+Math.random()*W*.15,W*.90);
    hoop.y=H*(.30+Math.random()*.20);
}

skillButtons.forEach(btn=>{
    btn.addEventListener("click",()=>{
        selectedSkill=btn.dataset.skill;
        skillButtons.forEach(b=>b.classList.toggle("selected",b===btn));
        updateSkillInfo();
    });
});

function updateSkillInfo(){
    const name=selectedSkill==="triple" ? "공 3개 발사" : "골대 크기 키우기";
    skillInfo.textContent=`선택한 스킬: ${name} · 골 5개마다 1회 충전 · 현재 ${skillCharges}회 · E 사용`;
}

let gameRunning=false;
let score=0;
let combo=0;
let lives=3;
let best=Number(localStorage.getItem("basketBest"))||0;
bestText.textContent=best;

const player={
    x:W*.17,
    y:H*.78,
    shootAnim:0,
    shooting:false
};

const ball={
    x:W*.215,
    y:H*.65,
    radius:Math.max(18,Math.min(W,H)*.03),
    vx:0,
    vy:0,
    flying:false,
    rotation:0,
    rimHit:false
};

const hoop={
    x:W*.82,
    y:H*.38,
    width:Math.max(95,W*.13),
    height:Math.max(60,H*.13),
    skillBoost:1,
    skillTimer:0
};

const GRAVITY=H*.0007;
let wind=0;
/* 성공 사운드 / 폭죽 */
let audioCtx=null;
let fireworks=[];

function initAudio(){
    if(!audioCtx){
        const AC=window.AudioContext||window.webkitAudioContext;
        if(AC) audioCtx=new AC();
    }
    if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
}

function playScoreSound(){
    initAudio();
    if(!audioCtx)return;

    const now=audioCtx.currentTime;
    const notes=[523.25,659.25,783.99,1046.5];

    notes.forEach((freq,i)=>{
        const osc=audioCtx.createOscillator();
        const gain=audioCtx.createGain();

        osc.type="triangle";
        osc.frequency.setValueAtTime(freq,now+i*0.09);
        gain.gain.setValueAtTime(0.0001,now+i*0.09);
        gain.gain.exponentialRampToValueAtTime(0.22,now+i*0.09+0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001,now+i*0.09+0.18);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now+i*0.09);
        osc.stop(now+i*0.09+0.2);
    });
}

function launchFireworks(){
    /* 골대 주변에서 여러 방향으로 터짐 */
    for(let burst=0;burst<3;burst++){
        const cx=hoop.x+(Math.random()-.5)*hoop.width*.8;
        const cy=hoop.y+Math.random()*hoop.height*.8;

        for(let i=0;i<42;i++){
            const angle=(Math.PI*2*i/42)+Math.random()*.15;
            const speed=2.5+Math.random()*4.5;

            fireworks.push({
                x:cx,
                y:cy,
                vx:Math.cos(angle)*speed,
                vy:Math.sin(angle)*speed,
                life:1,
                size:2+Math.random()*3
            });
        }
    }
}

function updateFireworks(){
    for(let i=fireworks.length-1;i>=0;i--){
        const p=fireworks[i];

        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=0.055;
        p.vx*=0.992;
        p.vy*=0.992;
        p.life-=0.018;

        if(p.life<=0)fireworks.splice(i,1);
    }
}

function drawFireworks(){
    ctx.save();
    for(const p of fireworks){
        ctx.globalAlpha=Math.max(0,p.life);
        ctx.fillStyle="white";
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha=1;
}

let aiming=false;
let aimX=0,aimY=0;

const buildings=[];
for(let i=0;i<18;i++){
    buildings.push({
        x:i/18,
        w:.055+Math.random()*.035,
        h:.10+Math.random()*.17
    });
}

function startGame(){
    initAudio();
    menu.style.display="none";
    gameRunning=true;
    score=0;
    combo=0;
    lives=3;
    skillCharges=0;
    madeShots=0;
    skillBalls=[];
    player.shooting=false;
    player.shootAnim=0;
    resetBall();
    newHoop();
    updateHUD();
    showMessage("START!",700);
}

startButton.addEventListener("click",startGame);

function resetBall(){
    ball.flying=false;
    ball.rimHit=false;
    ball.vx=0;
    ball.vy=0;
    ball.rotation=0;
    ball.x=player.x+W*.045;
    ball.y=player.y-H*.13;
    player.shooting=false;
    player.shootAnim=0;
}

function newHoop(){
    const difficulty=Math.min(score,15);
    hoop.width=Math.max(W*.055,W*.13-difficulty*W*.0035);
    hoop.height=Math.max(H*.075,H*.13-difficulty*H*.002);
    if(hoop.skillBoost) {
        hoop.width*=hoop.skillBoost;
        hoop.height*=hoop.skillBoost;
    }
    hoop.x=Math.min(W*(.73+Math.random()*.18),W*.91);
    hoop.y=H*(.27+Math.random()*.24);
    wind=(Math.random()-.5)*W*.00005;
}

function useSkill(){
    if(!gameRunning || skillCharges<=0)return;

    /* 스킬은 한 번 사용할 때 충전 1개 소비 */
    skillCharges--;
    updateSkillInfo();

    if(selectedSkill==="triple"){
        /* 현재 공이 날아가는 중이면 그 방향/속도를 복제한다.
           정지 상태면 기본 발사 방향으로 3개를 동시에 만든다. */
        let baseVx=ball.flying ? ball.vx : W*.012;
        let baseVy=ball.flying ? ball.vy : -H*.018;

        if(!ball.flying){
            ball.vx=baseVx;
            ball.vy=baseVy;
            ball.flying=true;
            player.shooting=true;
            player.shootAnim=0;
        }

        const spread=W*.0028;
        [-1,0,1].forEach((n,i)=>{
            if(i===1)return; // 기존 ball이 가운데 공 역할
            skillBalls.push({
                x:ball.x+n*W*.012,
                y:ball.y,
                radius:ball.radius,
                vx:baseVx+n*spread,
                vy:baseVy-Math.abs(n)*H*.001,
                flying:true,
                rotation:0
            });
        });

        showMessage("🏀🏀🏀 TRIPLE SHOT!",800);
    }else{
        /* 골대 확대: 현재 골대 크기를 잠시 크게 만든다. */
        hoop.skillBoost=1.65;
        hoop.skillTimer=900;
        showMessage("BIG HOOP!",800);
    }
}

window.addEventListener("keydown",e=>{
    if(e.key.toLowerCase()==="e"){
        e.preventDefault();
        useSkill();
    }
});

function updateSkillBalls(){
    const floorY=H*.72;

    for(let i=skillBalls.length-1;i>=0;i--){
        const b=skillBalls[i];
        if(!b.flying){
            skillBalls.splice(i,1);
            continue;
        }

        const prevX=b.x, prevY=b.y;
        b.vy+=GRAVITY;
        b.vx+=wind;
        b.x+=b.vx;
        b.y+=b.vy;
        b.rotation+=b.vx*.04;

        checkRimCollisionFor(b);

        /* 림을 튕긴 뒤에도 중앙을 위->아래로 통과하면 골 */
        if(checkScoreCrossingFor(b,prevX,prevY)){
            b.flying=false;
            combo++;
            madeShots++;
            if(madeShots%5===0){
                skillCharges++;
                updateSkillInfo();
            }
            score+=10*combo;
            if(score>best){
                best=score;
                localStorage.setItem("basketBest",best);
            }
            playScoreSound();
            launchFireworks();
            updateHUD();
            showMessage("+"+(10*combo),600);
            skillBalls.splice(i,1);
            continue;
        }

        /* 추가 공은 바닥에 닿으면 사라지지만 목숨은 깎지 않음 */
        if(b.y+b.radius>=floorY || b.x>W+120 || b.x<-120 || b.y>H+120){
            skillBalls.splice(i,1);
        }
    }
}

function checkScoreCrossingFor(b,prevX,prevY){
    const rimY=hoop.y+hoop.height*.55;
    const innerLeft=hoop.x-hoop.width*.38;
    const innerRight=hoop.x+hoop.width*.38;

    return prevY < rimY-b.radius*.25 &&
           b.y >= rimY-b.radius*.25 &&
           b.vy>0 &&
           b.x>innerLeft+b.radius*.15 &&
           b.x<innerRight-b.radius*.15;
}

function checkRimCollisionFor(b){
    const rimY=hoop.y+hoop.height*.55;
    const left=hoop.x-hoop.width/2;
    const right=hoop.x+hoop.width/2;
    const r=b.radius;
    const points=[
        {x:left,y:rimY},
        {x:right,y:rimY}
    ];

    for(const pt of points){
        let dx=b.x-pt.x, dy=b.y-pt.y;
        let dist=Math.hypot(dx,dy);
        const minDist=r+Math.max(6,W*.006);
        if(dist<minDist){
            if(dist<.001)dist=.001;
            const nx=dx/dist, ny=dy/dist;
            b.x=pt.x+nx*minDist;
            b.y=pt.y+ny*minDist;
            const dot=b.vx*nx+b.vy*ny;
            if(dot<0){
                b.vx-=1.72*dot*nx;
                b.vy-=1.72*dot*ny;
                b.vx*=.94;
                b.vy*=.94;
            }
        }
    }
}

function getPointer(e){
    const rect=canvas.getBoundingClientRect();
    const source=e.touches?e.touches[0]:e;
    return{
        x:source.clientX-rect.left,
        y:source.clientY-rect.top
    };
}

function pointerDown(e){
    if(!gameRunning||ball.flying||player.shooting)return;
    e.preventDefault();
    const p=getPointer(e);
    aiming=true;
    aimX=p.x;
    aimY=p.y;
    powerBar.style.opacity=1;
    updatePower();
}

function pointerMove(e){
    if(!aiming)return;
    e.preventDefault();
    const p=getPointer(e);
    aimX=p.x;
    aimY=p.y;
    updatePower();
}

function pointerUp(e){
    if(!aiming)return;
    e.preventDefault();
    aiming=false;
    powerBar.style.opacity=0;
    shoot();
}

canvas.addEventListener("mousedown",pointerDown);
canvas.addEventListener("mousemove",pointerMove);
canvas.addEventListener("mouseup",pointerUp);
canvas.addEventListener("touchstart",pointerDown,{passive:false});
canvas.addEventListener("touchmove",pointerMove,{passive:false});
canvas.addEventListener("touchend",pointerUp,{passive:false});

function getShotData(){
    const dx=ball.x-aimX;
    const dy=ball.y-aimY;
    const distance=Math.hypot(dx,dy);
    if(distance<1)return{distance:0,power:0,vx:0,vy:0};
    const power=Math.min(distance/13,30);
    return{
        distance,
        power,
        vx:(dx/distance)*power,
        vy:(dy/distance)*power
    };
}

function updatePower(){
    const s=getShotData();
    powerFill.style.width=Math.min(s.distance/3,100)+"%";
}

function shoot(){
    const s=getShotData();
    if(s.distance<20)return;

    ball.vx=s.vx;
    ball.vy=s.vy;
    ball.flying=true;

    /* 슈팅 모션 시작 */
    player.shooting=true;
    player.shootAnim=0;
}

function update(){
    if(!gameRunning)return;

    if(hoop.skillTimer>0){
        hoop.skillTimer--;
        if(hoop.skillTimer<=0)hoop.skillBoost=1;
    }
    updateSkillBalls();

    /* 캐릭터 슈팅 모션 */
    if(player.shooting){
        player.shootAnim+=0.055;
        if(player.shootAnim>=1){
            player.shootAnim=1;
            player.shooting=false;
        }
    }

    if(ball.flying){
        const prevX=ball.x;
        const prevY=ball.y;

        ball.vy+=GRAVITY;
        ball.vx+=wind;
        ball.x+=ball.vx;
        ball.y+=ball.vy;
        ball.rotation+=ball.vx*.04;

        /* 골대 테두리(림)는 장애물이다. 닿으면 튕긴다. */
        if(checkRimCollision()){
            /* 충돌 후에는 골인 판정을 잠시 건너뛰어 림에 닿은 공이 골로 처리되지 않게 함 */
            ball.rimHit=true;
        }

        /* 골인: 림을 맞은 것이 아니라, 공이 림 위쪽에서 중앙 개구부를 통과해 내려갈 때 */
        if(checkScoreCrossing(prevX,prevY)){
            scoreGoal();
            return;
        }

        /* 바닥에 닿으면 무조건 미스 */
        const floorY=H*.72;
        if(ball.y+ball.radius>=floorY){
            ball.y=floorY-ball.radius;
            miss();
            return;
        }

        /* 화면 밖으로 나가도 미스 */
        if(ball.x>W+120||ball.x<-120||ball.y>H+120){
            miss();
            return;
        }
    }else if(!player.shooting){
        ball.x=player.x+W*.045;
        ball.y=player.y-H*.13;
    }
}

function checkScoreCrossing(prevX,prevY){
    const rimY=hoop.y+hoop.height*.55;
    const innerLeft=hoop.x-hoop.width*.38;
    const innerRight=hoop.x+hoop.width*.38;

    /* 공 중심이 림보다 위에 있다가 아래로 내려오며 통과해야 골인 */
    return prevY < rimY-ball.radius*.25 &&
           ball.y >= rimY-ball.radius*.25 &&
           ball.vy>0 &&
           ball.x>innerLeft+ball.radius*.15 &&
           ball.x<innerRight-ball.radius*.15;
}

function checkRimCollision(){
    const rimY=hoop.y+hoop.height*.55;
    const left=hoop.x-hoop.width/2;
    const right=hoop.x+hoop.width/2;
    const r=ball.radius;

    /* 림의 양쪽 끝을 둥근 물체로 만들어 공이 닿으면 반사 */
    const points=[
        {x:left,y:rimY},
        {x:right,y:rimY}
    ];

    let hit=false;
    for(const pt of points){
        let dx=ball.x-pt.x;
        let dy=ball.y-pt.y;
        let dist=Math.hypot(dx,dy);
        const minDist=r+Math.max(6,W*.006);
        if(dist<minDist){
            if(dist<0.001)dist=0.001;
            const nx=dx/dist;
            const ny=dy/dist;
            ball.x=pt.x+nx*minDist;
            ball.y=pt.y+ny*minDist;

            const dot=ball.vx*nx+ball.vy*ny;
            if(dot<0){
                ball.vx-=1.72*dot*nx;
                ball.vy-=1.72*dot*ny;
                ball.vx*=.94;
                ball.vy*=.94;
            }
            hit=true;
        }
    }

    /* 림의 앞/뒤 가장자리도 물체처럼 작동하도록 아주 얇은 아래쪽 곡선 영역 처리 */
    const outerLeft=left+r*.35;
    const outerRight=right-r*.35;
    if(ball.x>outerLeft && ball.x<outerRight &&
       Math.abs(ball.y-(rimY+Math.max(7,H*.012)))<r*.55 && ball.vy<0){
        ball.vy=Math.abs(ball.vy)*.82;
        ball.y=rimY+Math.max(7,H*.012)+r*.55;
        hit=true;
    }

    return hit;
}

function scoreGoal(){
    ball.flying=false;
    combo++;
    madeShots++;

    /* 골 5개마다 스킬 1회 충전 */
    if(madeShots%5===0){
        skillCharges++;
        updateSkillInfo();
        showMessage("SKILL CHARGED!  E",900);
    }

    playScoreSound();
    launchFireworks();
    score+=10*combo;

    if(score>best){
        best=score;
        localStorage.setItem("basketBest",best);
    }

    updateHUD();
    showMessage("+"+(10*combo),700);

    setTimeout(()=>{
        if(!gameRunning)return;
        resetBall();
        newHoop();
    },500);
}

function miss(){
    /* 미스 순간 콤보는 무조건 끊긴다 */
    combo=0;
    lives=Math.max(0,lives-1);
    updateHUD();

    if(lives<=0){
        gameOver();
        return;
    }

    /* 바로 새 공을 생성해서 다시 슛할 수 있게 한다 */
    resetBall();
    showMessage("MISS!  ♥ "+lives,500);
}

function gameOver(){
    gameRunning=false;
    menu.style.display="flex";
    startButton.textContent="다시 시작";
    document.querySelector(".subtitle").textContent="GAME OVER  ·  SCORE "+score+"  ·  BEST "+best;
}

function updateHUD(){
    scoreText.textContent=score;
    comboText.textContent="x"+combo;
    bestText.textContent=best;
    livesText.textContent="♥".repeat(lives)+"♡".repeat(3-lives);
}

function showMessage(text,duration){
    message.textContent=text;
    message.style.opacity=1;
    setTimeout(()=>message.style.opacity=0,duration);
}

/* -------------------------
   배경
------------------------- */
function drawBackground(){
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,"#68b9f0");
    sky.addColorStop(.58,"#d7f3ff");
    sky.addColorStop(.59,"#b7b7b7");
    sky.addColorStop(1,"#777");
    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle="rgba(40,70,90,.22)";
    for(const b of buildings){
        const bx=b.x*W;
        const bh=b.h*H;
        ctx.fillRect(bx,H*.59-bh,b.w*W,bh);
    }

    /* 코트 */
    ctx.fillStyle="#777";
    ctx.fillRect(0,H*.72,W,H*.28);

    ctx.strokeStyle="rgba(255,255,255,.55)";
    ctx.lineWidth=4;

    ctx.beginPath();
    ctx.arc(W*.18,H*.72,Math.min(W,H)*.17,Math.PI,Math.PI*2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0,H*.88);
    ctx.lineTo(W,H*.88);
    ctx.stroke();
}

/* -------------------------
   골대
------------------------- */
function drawHoop(){
    const left=hoop.x-hoop.width/2;
    const rimY=hoop.y+hoop.height*.55;

    /* 기둥 */
    ctx.strokeStyle="#333";
    ctx.lineWidth=Math.max(8,W*.008);
    ctx.beginPath();
    ctx.moveTo(hoop.x+hoop.width*.45,rimY);
    ctx.lineTo(hoop.x+hoop.width*.45,H*.72);
    ctx.stroke();

    /* 백보드 */
    ctx.fillStyle="rgba(255,255,255,.88)";
    ctx.fillRect(left-20,hoop.y,hoop.width+40,14);

    ctx.strokeStyle="#444";
    ctx.lineWidth=4;
    ctx.strokeRect(left-20,hoop.y,hoop.width+40,14);

    /* 림 */
    ctx.strokeStyle="#f04a17";
    ctx.lineWidth=Math.max(7,W*.006);
    ctx.beginPath();
    ctx.ellipse(hoop.x,rimY,hoop.width/2,Math.max(7,H*.012),0,0,Math.PI*2);
    ctx.stroke();

    /* 그물 */
    ctx.strokeStyle="rgba(255,255,255,.72)";
    ctx.lineWidth=2;

    for(let i=-4;i<=4;i++){
        ctx.beginPath();
        ctx.moveTo(hoop.x+i*hoop.width/10,rimY);
        ctx.lineTo(hoop.x+i*hoop.width/14,rimY+hoop.height*.52);
        ctx.stroke();
    }
}

/* -------------------------
   사람
   슈팅 애니메이션
------------------------- */
function drawPlayer(){
    const x=player.x;
    const y=player.y;
    const a=player.shootAnim;

    /*
      a:
      0   = 준비 자세
      .35 = 공을 위로 올림
      .55 = 릴리즈
      1   = 팔로우스루
    */

    let raise=Math.sin(Math.min(a/.65,1)*Math.PI/2);
    let follow=Math.max(0,(a-.55)/.45);

    ctx.save();
    ctx.translate(x,y);

    /* 그림자 */
    ctx.fillStyle="rgba(0,0,0,.25)";
    ctx.beginPath();
    ctx.ellipse(0,5,Math.min(W,H)*.055,Math.min(W,H)*.012,0,0,Math.PI*2);
    ctx.fill();

    const leg=Math.min(W,H)*.055;
    const torso=Math.min(W,H)*.085;

    /* 다리 */
    ctx.strokeStyle="#222";
    ctx.lineWidth=Math.max(10,Math.min(W,H)*.018);
    ctx.lineCap="round";

    ctx.beginPath();
    ctx.moveTo(-10,-10);
    ctx.lineTo(-leg*.55,leg*.75);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(10,-10);
    ctx.lineTo(leg*.55,leg*.65);
    ctx.stroke();

    /* 신발 */
    ctx.fillStyle="#f2f2f2";
    ctx.beginPath();
    ctx.ellipse(-leg*.65,leg*.82,leg*.34,leg*.13,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(leg*.65,leg*.72,leg*.34,leg*.13,0,0,Math.PI*2);
    ctx.fill();

    /* 몸 */
    ctx.fillStyle="#e53935";
    ctx.beginPath();
    ctx.moveTo(-torso*.42,-torso*1.05);
    ctx.lineTo(torso*.42,-torso*1.05);
    ctx.lineTo(torso*.34,-torso*.08);
    ctx.lineTo(-torso*.34,-torso*.08);
    ctx.closePath();
    ctx.fill();

    /* 번호 */
    ctx.fillStyle="white";
    ctx.font=`bold ${Math.max(20,Math.min(W,H)*.035)}px Arial`;
    ctx.textAlign="center";
    ctx.fillText("23",0,-torso*.48);

    /* 목 */
    ctx.fillStyle="#d99a6c";
    ctx.fillRect(-7,-torso*1.15,14,18);

    /* 머리 */
    ctx.beginPath();
    ctx.arc(0,-torso*1.42,torso*.32,0,Math.PI*2);
    ctx.fill();

    /* 머리카락 */
    ctx.fillStyle="#171717";
    ctx.beginPath();
    ctx.arc(0,-torso*1.51,torso*.33,Math.PI,Math.PI*2);
    ctx.fill();

    /* 머리띠 */
    ctx.strokeStyle="white";
    ctx.lineWidth=4;
    ctx.beginPath();
    ctx.moveTo(-torso*.28,-torso*1.51);
    ctx.lineTo(torso*.28,-torso*1.51);
    ctx.stroke();

    /* 팔 */
    ctx.strokeStyle="#d99a6c";
    ctx.lineWidth=Math.max(9,Math.min(W,H)*.017);

    /*
      슈팅 전:
      공을 양손으로 가슴 앞에 둠.

      슈팅:
      양팔을 위로 올리고
      마지막에는 팔을 완전히 펴서
      팔로우스루.
    */
    const handX=torso*.58;
    const handY=-torso*.82-raise*torso*.72;

    ctx.beginPath();
    ctx.moveTo(torso*.30,-torso*.82);
    ctx.lineTo(torso*.50,-torso*.75);
    ctx.lineTo(handX,handY);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-torso*.30,-torso*.82);
    ctx.lineTo(-torso*.50,-torso*.72);
    ctx.lineTo(handX*.72,handY+8);
    ctx.stroke();

    /* 릴리즈 이후 오른팔 팔로우스루 */
    if(follow>0){
        ctx.strokeStyle="#d99a6c";
        ctx.lineWidth=Math.max(9,Math.min(W,H)*.017);

        ctx.beginPath();
        ctx.moveTo(torso*.30,-torso*.82);
        ctx.lineTo(torso*.75,-torso*1.18);
        ctx.lineTo(torso*.82,-torso*1.72);
        ctx.stroke();
    }

    ctx.restore();
}

/* -------------------------
   공
------------------------- */
function drawExtraBall(b){
    ctx.fillStyle="rgba(0,0,0,.18)";
    ctx.beginPath();
    ctx.ellipse(b.x+5,H*.72,b.radius*1.05,b.radius*.25,0,0,Math.PI*2);
    ctx.fill();

    const g=ctx.createRadialGradient(
        b.x-b.radius*.35,b.y-b.radius*.35,2,
        b.x,b.y,b.radius
    );
    g.addColorStop(0,"#ffb347");
    g.addColorStop(1,"#e65100");
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);
    ctx.fill();

    ctx.save();
    ctx.translate(b.x,b.y);
    ctx.rotate(b.rotation);
    ctx.strokeStyle="#351500";
    ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.arc(0,0,b.radius*.7,-Math.PI/2,Math.PI/2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-b.radius,0);
    ctx.quadraticCurveTo(0,-7,b.radius,0);
    ctx.stroke();
    ctx.restore();
}

function drawBall(){
    ctx.fillStyle="rgba(0,0,0,.22)";
    ctx.beginPath();
    ctx.ellipse(ball.x+7,H*.72,ball.radius*1.2,ball.radius*.28,0,0,Math.PI*2);
    ctx.fill();

    const g=ctx.createRadialGradient(
        ball.x-ball.radius*.35,
        ball.y-ball.radius*.35,
        2,
        ball.x,
        ball.y,
        ball.radius
    );
    g.addColorStop(0,"#ffb347");
    g.addColorStop(1,"#e65100");

    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);
    ctx.fill();

    ctx.save();
    ctx.translate(ball.x,ball.y);
    ctx.rotate(ball.rotation);

    ctx.strokeStyle="#351500";
    ctx.lineWidth=2.5;

    ctx.beginPath();
    ctx.arc(0,0,ball.radius*.7,-Math.PI/2,Math.PI/2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-ball.radius,0);
    ctx.quadraticCurveTo(0,-7,ball.radius,0);
    ctx.stroke();

    ctx.restore();
}

/* -------------------------
   포물선 궤적
------------------------- */
function drawTrajectory(){
    if(!aiming)return;

    const s=getShotData();
    if(s.distance<20)return;

    ctx.fillStyle="rgba(255,255,255,.9)";

    let px=ball.x;
    let py=ball.y;
    let vx=s.vx;
    let vy=s.vy;

    for(let t=0;t<38;t+=2){

        const fx=px+vx*t+0.5*wind*t*t;
        const fy=py+vy*t+0.5*GRAVITY*t*t;

        if(fx<0||fx>W||fy<0||fy>H)break;

        const nearHoop=Math.hypot(
            fx-hoop.x,
            fy-(hoop.y+hoop.height*.55)
        )<hoop.width*.55;

        ctx.beginPath();
        ctx.arc(
            fx,
            fy,
            nearHoop?5:3.5,
            0,
            Math.PI*2
        );
        ctx.fill();
    }
}

function drawAimGuide(){
    if(!aiming)return;

    const s=getShotData();
    if(s.distance<20)return;

    /* 당기는 선 */
    ctx.strokeStyle="rgba(255,255,255,.55)";
    ctx.lineWidth=3;
    ctx.setLineDash([8,8]);

    ctx.beginPath();
    ctx.moveTo(ball.x,ball.y);
    ctx.lineTo(aimX,aimY);
    ctx.stroke();

    ctx.setLineDash([]);

    /* 포인터 */
    ctx.fillStyle="#00ffcc";
    ctx.beginPath();
    ctx.arc(aimX,aimY,9,0,Math.PI*2);
    ctx.fill();

    /* 포물선 */
    drawTrajectory();
}

function drawWind(){
    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.font=`${Math.max(16,Math.min(W,H)*.025)}px Arial`;
    ctx.textAlign="center";
    ctx.fillText(
        wind>=0?"🌬️ 바람 →":"🌬️ ← 바람",
        W*.5,
        45
    );
}

function draw(){
    ctx.clearRect(0,0,W,H);
    drawBackground();
    drawWind();
    drawHoop();
    drawPlayer();
    drawAimGuide();
    drawBall();
    for(const b of skillBalls) drawExtraBall(b);
    drawFireworks();
}

function loop(){
    update();
    updateFireworks();
    draw();
    requestAnimationFrame(loop);
}

resize();
loop();
</script>
